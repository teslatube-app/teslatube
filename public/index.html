<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>TeslaTube</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <a class="logo" href="#/">Tesla<span>Tube</span></a>
  <form id="searchform" action="#/" method="get">
    <input id="searchbox" type="search" placeholder="Search YouTube" autocomplete="off" autocapitalize="off">
    <button id="searchbtn" type="submit" aria-label="Search">Search</button>
  </form>
  <label class="longtoggle"><input type="checkbox" id="longonly"> <span>&gt;20 min only</span></label>
</header>
<main id="main"><div class="hint">Search for something to watch.</div></main>
<script src="/app.js"></script>
</body>
</html>
